name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional artifact version; must match the workspace version
        required: false
        type: string
      upload_release:
        description: Create or update the v<version> GitHub Release
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  package:
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          # Intel macOS runners exist until the macOS 15 image retires in Fall 2027.
          - label: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          # The Linux legs stay on 22.04 deliberately: it sets the glibc 2.35 floor
          # for released binaries. Moving to 24.04 raises that to 2.39 and drops
          # Ubuntu 22.04 and Debian 12 users. Image deprecation begins 2026-09-17
          # and it is fully unsupported from 2027-04-17 — decide before then rather
          # than letting it lapse.
          - label: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - label: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - label: windows-arm64
            os: windows-2025
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: release-${{ matrix.target }}
          cache-on-failure: 'true'
          save-cache: always

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps
        with:
          extra_packages: curl file patchelf desktop-file-utils dpkg-dev rpm

      - name: Install AppImage tooling
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/ci/install-appimagetool.sh "${TARGET}"

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/install-nsis.ps1

      - name: Resolve package version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == 'tag' ]]; then
            version="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            version="${INPUT_VERSION}"
          else
            version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Package native application
        env:
          NYATERM_VERSION: ${{ steps.version.outputs.value }}
          APPIMAGE_EXTRACT_AND_RUN: ${{ runner.os == 'Linux' && '1' || '' }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: python scripts/release/package_native.py "${TARGET}"

      - name: Verify native package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.version.outputs.value }}
        run: >-
          python scripts/release/verify_native_package.py
          --target "${TARGET}"
          --version "${VERSION}"
          --dist dist

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: NyaTerm-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.upload_release)
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: NyaTerm-*
          path: dist-release
          merge-multiple: true

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == 'tag' ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            if [[ -z "${INPUT_VERSION:-}" ]]; then
              echo 'Manual release upload requires the version input' >&2
              exit 1
            fi
            tag="v${INPUT_VERSION#v}"
          fi
          version="${tag#v}"
          prerelease='false'
          [[ "${version}" == *-* ]] && prerelease='true'
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

      # Compare the downloaded set against the names the packaging script itself
      # derives, so adding a target does not mean remembering to bump a literal.
      - name: Validate release assets
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: python3 scripts/ci/check_release_assets.py --dist dist-release --version "${VERSION}"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            args=(release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "NyaTerm ${TAG}" --generate-notes)
            [[ "${PRERELEASE}" == 'true' ]] && args+=(--prerelease)
            gh "${args[@]}"
          fi
          gh release upload "${TAG}" dist-release/* --repo "${GITHUB_REPOSITORY}" --clobber
