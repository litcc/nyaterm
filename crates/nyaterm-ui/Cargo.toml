[package]
name = "nyaterm-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gpui.workspace = true
gpui-component.workspace = true

[dev-dependencies]
# Tests assert the Base scrollbar projection, which is the global the
# `Scrollbar` element reads. Production code goes through gpui-component.
gpui-base.workspace = true
gpui = { workspace = true, features = ["test-support"] }
# Only to assert that gpui-component reads the same process-wide locale that
# nyaterm-desktop sets. Production code here never translates.
rust-i18n.workspace = true
